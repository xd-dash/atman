name: Identity boundary

on:
  pull_request:
    branches: [main]
    paths:
      - 'cmd/atman/**'
      - 'cmd/mint-token/**'
      - 'internal/gateway/**'
      - 'internal/googlemint/**'
      - 'internal/handler/**'
      - 'internal/identity/**'
      - 'internal/tenantregistry/**'
      - '.github/workflows/identity-boundary.yml'

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - name: Check formatting for identity and Google compatibility boundaries
        run: test -z "$(gofmt -l cmd/atman cmd/mint-token internal/gateway internal/googlemint internal/handler internal/identity internal/tenantregistry)"
      - name: Vet identity and Google compatibility boundaries
        run: go vet ./cmd/atman ./cmd/mint-token ./internal/gateway ./internal/googlemint ./internal/handler ./internal/identity/... ./internal/tenantregistry
      - name: Test identity and Google compatibility boundaries
        run: go test ./cmd/atman ./cmd/mint-token ./internal/gateway ./internal/googlemint ./internal/handler ./internal/identity/... ./internal/tenantregistry
